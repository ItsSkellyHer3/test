<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Bot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.5.1/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.5.1/dist/cdn/beer.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        #login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #main-content {
            display: none;
        }
    </style>
</head>
<body class="dark">
    <div id="login-page">
        <article class="no-padding">
            <div class="padding">
                <h5>Login</h5>
                <div class="field label border">
                    <input type="text" id="username">
                    <label>Username</label>
                </div>
                <div class="field label border">
                    <input type="password" id="password">
                    <label>Password</label>
                </div>
                <nav class="right-align">
                    <button id="login-btn">Login</button>
                </nav>
            </div>
        </article>
    </div>

    <div id="main-content">
        <nav class="left drawer">
            <header>
                <i class="extra">android</i>
                <h5>OSINT Bot</h5>
            </header>
        <a class="active" onclick="showView('dashboard', this)">
                <i>dashboard</i>
                <span>Dashboard</span>
            </a>
        <a onclick="showView('chat', this)">
                <i>chat</i>
                <span>Chat Monitor</span>
            </a>
        <a onclick="showView('groups', this)">
                <i>group</i>
                <span>Groups</span>
            </a>
            <a>
                <i>analytics</i>
                <span>Analytics</span>
            </a>
            <a>
                <i>settings</i>
                <span>Settings</span>
            </a>
            <div class="max"></div>
            <a id="logout-btn">
                <i>logout</i>
                <span>Logout</span>
            </a>
        </nav>

        <main class="responsive">
            <header class="primary">
                <nav>
                    <button class="circle transparent" data-ui="#nav">
                        <i>menu</i>
                    </button>
                    <h5 class="max" id="view-title">Dashboard</h5>
                    <button class="circle transparent" onclick="ui('mode', ui('mode') == 'dark' ? 'light' : 'dark')">
                        <i>brightness_medium</i>
                    </button>
                </nav>
            </header>

            <div id="dashboard-view" class="view">
                <div class="grid">
                <div class="s12 m6 l3">
                    <article class="primary-container">
                        <div class="row">
                            <i class="extra">link</i>
                            <div class="max">
                                <h5>Status</h5>
                                <p id="bot-status">Connecting...</p>
                            </div>
                        </div>
                    </article>
                </div>
                <div class="s12 m6 l3">
                    <article class="secondary-container">
                        <div class="row">
                            <i class="extra">schedule</i>
                            <div class="max">
                                <h5>Uptime</h5>
                                <p id="bot-uptime">0s</p>
                            </div>
                        </div>
                    </article>
                </div>
                <div class="s12 m6 l3">
                    <article class="tertiary-container">
                        <div class="row">
                            <i class="extra">memory</i>
                            <div class="max">
                                <h5>Memory</h5>
                                <p id="bot-memory">0 MB</p>
                            </div>
                        </div>
                    </article>
                </div>
                <div class="s12 m6 l3">
                    <article class="surface-container-highest">
                        <div class="row">
                            <i class="extra">analytics</i>
                            <div class="max">
                                <h5>Active Users (24h)</h5>
                                <p id="active-users">0</p>
                            </div>
                        </div>
                    </article>
                </div>
            </div>

            </div> <!-- End Dashboard View -->

            <div id="groups-view" class="view" style="display: none;">
                <div class="grid" id="groups-list">
                    <!-- Groups cards -->
                </div>
            </div>

            <div id="chat-view" class="view" style="display: none;">
                <div class="grid">
                    <div class="s12 m4">
                        <article class="no-padding">
                            <div class="padding"><h5>Chats</h5></div>
                            <div id="chat-list" class="scroll" style="max-height: 70vh; overflow-y: auto;">
                                <!-- Chat list items -->
                            </div>
                        </article>
                    </div>
                    <div class="s12 m8">
                        <article class="no-padding">
                            <div class="padding"><h5 id="current-chat-name">Select a chat</h5></div>
                            <div id="chat-messages" class="scroll padding" style="height: 60vh; overflow-y: auto; display: flex; flex-direction: column-reverse;">
                                <!-- Messages -->
                            </div>
                        </article>
                    </div>
                </div>
            </div>

            <div class="grid">
                <div class="s12 m6">
                    <article>
                        <h5>Top Commands</h5>
                        <div id="top-commands"></div>
                    </article>
                </div>
                <div class="s12 m6">
                    <article>
                        <h5>Quick Actions</h5>
                        <nav>
                            <button class="border">Restart Bot</button>
                            <button class="border">Clear Logs</button>
                        </nav>
                    </article>
                </div>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
